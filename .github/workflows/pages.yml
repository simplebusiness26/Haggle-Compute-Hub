name: Deploy Compute Hub Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'state/**'
      - 'results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/data _site/results
          cp dashboard/index.html _site/index.html
          for f in queue resources history catalog projects backlog system; do
            if [ -f "state/$f.json" ]; then cp "state/$f.json" "_site/data/$f.json"; fi
          done
          if [ -f results/latest.md ]; then cp results/latest.md _site/results/latest.md; fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
