name: Deploy Compute Hub Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'state/**'
      - 'results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/data _site/results
          cp dashboard/index.html _site/index.html
          cp state/queue.json _site/data/queue.json
          cp state/resources.json _site/data/resources.json
          cp state/history.json _site/data/history.json
          cp state/catalog.json _site/data/catalog.json
          if [ -f results/latest.md ]; then cp results/latest.md _site/results/latest.md; fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
