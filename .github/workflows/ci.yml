name: Compute Hub CI

on:
  push:
    paths:
      - 'hub.py'
      - 'monitor.py'
      - 'guard.py'
      - 'auth_probe.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile hub.py monitor.py guard.py auth_probe.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
