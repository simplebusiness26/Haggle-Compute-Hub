<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#09101d" />
<title>Kaggle Compute Hub</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--panel:#111929;--line:#28354e;--text:#f5f7fb;--muted:#9aa7bd;--good:#49df98;--warn:#ffc857;--bad:#ff7582;--blue:#6da8ff;--purple:#ad91ff;--r:22px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b2b50 0,#0b1221 34%,var(--bg) 70%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.shell{width:min(100%,920px);margin:auto;padding:24px 15px 72px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin:8px 2px 20px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:var(--blue)}h1{font-size:31px;line-height:1;margin:7px 0 8px}.sub,.meta{color:var(--muted);font-size:13px;line-height:1.45}.refresh{border:1px solid var(--line);background:#162037;color:#fff;border-radius:14px;padding:11px 13px;font-weight:850}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.metric,.section{border:1px solid var(--line);background:linear-gradient(180deg,rgba(24,35,58,.95),rgba(14,21,36,.97));border-radius:var(--r);box-shadow:0 15px 38px rgba(0,0,0,.18)}.metric{padding:15px}.label{font-size:11px;color:var(--muted);font-weight:800}.value{font-size:23px;font-weight:950;margin-top:6px}.wide{grid-column:1/-1}.bar{height:8px;border-radius:99px;background:#293650;overflow:hidden;margin-top:12px}.bar div{height:100%;background:linear-gradient(90deg,var(--good),var(--blue));border-radius:99px}.section{padding:17px;margin-top:13px}.section h2{font-size:17px;margin:0 0 12px}.connection{padding:14px 15px;border-radius:17px;border:1px solid var(--line);display:flex;align-items:center;gap:11px}.dot{width:11px;height:11px;border-radius:99px;background:var(--warn);box-shadow:0 0 18px currentColor;flex:0 0 auto}.dot.ok{background:var(--good)}.dot.bad{background:var(--bad)}.next{padding:18px;border:1px solid #38517d;background:linear-gradient(145deg,rgba(51,80,142,.45),rgba(24,31,54,.92));border-radius:19px}.title{font-size:18px;font-weight:950;margin:4px 0}.family{font-size:11px;color:var(--purple);font-weight:900;text-transform:uppercase;letter-spacing:.06em}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:10px;font-weight:850;padding:6px 8px;border:1px solid var(--line);background:#111a2d;color:#cbd4e3;border-radius:999px}.chip.good{color:var(--good);border-color:#28634b}.chip.warn{color:var(--warn);border-color:#6e5b31}.row{padding:14px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0;padding-top:1px}.rowtop{display:flex;justify-content:space-between;gap:12px}.rowtitle{font-size:14px;font-weight:900}.score{font-weight:950;color:var(--blue);white-space:nowrap}.status{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:950;border-radius:999px;padding:5px 7px;margin-right:5px;display:inline-block}.queued{background:#2d2741;color:#dfcbff}.running,.dispatching{background:#17372a;color:#7bf1b0}.completed{background:#193248;color:#89caff}.failed,.cancelled{background:#44212a;color:#ffb1b8}.event{display:grid;grid-template-columns:78px 1fr;gap:9px;font-size:11px;padding:9px 0;border-top:1px solid var(--line)}.event:first-child{border-top:0}.time{color:var(--muted)}.empty{color:var(--muted);font-size:12px;padding:10px 0}.error{padding:14px;border-radius:16px;background:#351c25;border:1px solid #6d3541;color:#ffbdc3;margin-bottom:12px}.footer{text-align:center;color:#68778f;font-size:10px;margin-top:22px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wide{grid-column:span 2}.shell{padding-top:36px}h1{font-size:39px}}
</style>
</head>
<body><main class="shell">
<header class="top"><div><div class="eyebrow">Free compute control plane</div><h1>Kaggle Compute Hub</h1><div class="sub">Spend scarce GPU time on the work with the highest expected value.</div></div><button class="refresh" onclick="loadAll()">Refresh</button></header>
<div id="error"></div>
<section class="section"><h2>Connection</h2><div id="connection"></div></section>
<section class="grid" id="metrics" style="margin-top:13px"></section>
<section class="section"><h2>Next best job</h2><div id="next"></div></section>
<section class="section"><h2>Queue & active work</h2><div id="jobs"></div></section>
<section class="section"><h2>GPU opportunity backlog</h2><div id="backlog"></div></section>
<section class="section"><h2>Project feeders</h2><div id="projects"></div></section>
<section class="section"><h2>Recent activity</h2><div id="events"></div></section>
<section class="section"><h2>Compute factories</h2><div id="families"></div></section>
<div class="footer" id="updated">Loading live state…</div>
</main>
<script>
const pw={low:.75,normal:1,high:1.5,urgent:2};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function urgency(j){if(!j.deadline)return 1;const h=(new Date(j.deadline)-Date.now())/36e5;if(h<=0)return .25;if(h<=24)return 2;if(h<=72)return 1.5;if(h<=168)return 1.2;return 1}function score(j){return Number(j.value||0)/Math.max(5,Number(j.estimated_minutes||30))*(pw[j.priority]||1)*urgency(j)*20}function hours(n){return `${Number(n||0).toFixed(1)}h`}function chip(s){return `<span class="status ${esc(s)}">${esc(s)}</span>`}async function j(path,optional=false){try{const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}catch(e){if(optional)return {};throw new Error(`${path}: ${e.message}`)}}
async function loadAll(){document.getElementById('error').innerHTML='';try{const [q,r,h,c,s,p,b]=await Promise.all([j('data/queue.json'),j('data/resources.json'),j('data/history.json'),j('data/catalog.json'),j('data/system.json',true),j('data/projects.json',true),j('data/backlog.json',true)]);render(q,r,h,c,s,p,b)}catch(e){document.getElementById('error').innerHTML=`<div class="error">Could not load live Hub data: ${esc(e.message)}</div>`}}
function render(q,r,h,c,s,p,b){const jobs=q.jobs||[],queued=jobs.filter(x=>x.status==='queued').map(x=>({...x,_score:score(x)})).sort((a,b)=>b._score-a._score),active=jobs.filter(x=>['running','dispatching'].includes(x.status)),done=jobs.filter(x=>x.status==='completed');const total=Number(r.configured_gpu_hours_per_week||30),used=Number(r.estimated_gpu_hours_used||0),reserve=total*Number(r.reserve_fraction||0),left=Math.max(0,total-used-reserve),pct=Math.min(100,total?used/total*100:0);
const auth=s.authenticated===true;document.getElementById('connection').innerHTML=`<div class="connection"><span class="dot ${auth?'ok':s.token_present===true?'bad':''}"></span><div><div class="rowtitle">${auth?'Kaggle connected':s.token_present===true?'Kaggle authentication needs attention':'Kaggle credential not verified yet'}</div><div class="meta">${esc(s.message||'The Hub will report connection health after its next worker run.')}${s.owner?' · '+esc(s.owner):''}</div></div></div>`;
document.getElementById('metrics').innerHTML=`<div class="metric wide"><div class="label">Weekly GPU budget estimate</div><div class="value">${hours(used)} / ${hours(total)}</div><div class="bar"><div style="width:${pct}%"></div></div></div><div class="metric"><div class="label">Unreserved left</div><div class="value">${hours(left)}</div></div><div class="metric"><div class="label">Protected reserve</div><div class="value">${hours(reserve)}</div></div><div class="metric"><div class="label">Active</div><div class="value">${active.length}</div></div><div class="metric"><div class="label">Queued</div><div class="value">${queued.length}</div></div>`;
const n=queued[0];document.getElementById('next').innerHTML=n?`<div class="next"><div class="family">${esc(c.families?.[n.family]?.label||n.family)}</div><div class="title">${esc(n.title)}</div><div class="meta">Highest current value/urgency/priority relative to estimated compute.</div><div class="chips"><span class="chip good">Score ${n._score.toFixed(1)}</span><span class="chip">Value ${esc(n.value)}/100</span><span class="chip">${esc(n.estimated_minutes)} min</span><span class="chip">${esc(String(n.compute).toUpperCase())}</span><span class="chip">${esc(n.priority)}</span></div></div>`:`<div class="empty">Nothing is waiting. Candidate opportunities are shown below.</div>`;
const ordered=[...active,...queued,...jobs.filter(x=>!['running','dispatching','queued'].includes(x.status)).slice(-8).reverse()];document.getElementById('jobs').innerHTML=ordered.length?ordered.map(x=>`<div class="row"><div class="rowtop"><div><div class="rowtitle">${chip(x.status)}${esc(x.title)}</div><div class="meta">${esc(c.families?.[x.family]?.label||x.family)} · ${esc(x.compute)} · ${esc(x.estimated_minutes)} min${x.kaggle_ref?' · '+esc(x.kaggle_ref):''}</div></div><div class="score">${x.status==='queued'?score(x).toFixed(1):esc(x.value)+'/100'}</div></div>${x.last_error?`<div class="meta">⚠ ${esc(x.last_error)}</div>`:''}</div>`).join(''):`<div class="empty">Queue is empty.</div>`;
const ideas=(b.ideas||[]).map(x=>({...x,_score:Number(x.value||0)/Math.max(5,Number(x.estimated_minutes||30))*20})).sort((a,b)=>b._score-a._score);document.getElementById('backlog').innerHTML=ideas.length?ideas.map(x=>`<div class="row"><div class="rowtop"><div><div class="family">${esc(c.families?.[x.family]?.label||x.family)}</div><div class="rowtitle">${esc(x.title)}</div><div class="meta">Candidate only — not consuming compute yet.</div></div><div class="score">${x._score.toFixed(1)}</div></div><div class="chips"><span class="chip">Value ${esc(x.value)}</span><span class="chip">~${esc(x.estimated_minutes)} min</span></div></div>`).join(''):`<div class="empty">No candidate workloads recorded.</div>`;
const projects=p.projects||[];document.getElementById('projects').innerHTML=projects.length?projects.map(x=>`<div class="row"><div class="rowtop"><div><div class="rowtitle">${esc(x.name)}</div><div class="meta">${esc(x.repository)} · ${esc(x.notes||'')}</div></div><span class="chip ${x.status==='connected-by-design'?'good':''}">${esc(x.status)}</span></div></div>`).join(''):`<div class="empty">No project feeders registered.</div>`;
const events=(h.events||[]).slice(0,12);document.getElementById('events').innerHTML=events.length?events.map(e=>`<div class="event"><div class="time">${new Date(e.at).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div><div><b>${esc(e.kind)}</b>${e.title?' · '+esc(e.title):''}${e.message?' · '+esc(e.message):''}</div></div>`).join(''):`<div class="empty">No activity yet.</div>`;
document.getElementById('families').innerHTML=Object.values(c.families||{}).map(v=>`<div class="row"><div class="rowtop"><div><div class="rowtitle">${esc(v.label)}</div><div class="meta">${esc(v.description)}</div></div><span class="chip">${esc(v.default_compute)}</span></div></div>`).join('');document.getElementById('updated').textContent=`Live state loaded ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`}
loadAll();
</script></body></html>
